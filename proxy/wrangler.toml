name = "verso-translate"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
AZURE_REGION = "brazilsouth"      # região do recurso Translator na Azure
MONTHLY_BUDGET = "1900000"        # abaixo dos 2M do F0: os contadores no KV são aproximados
IP_DAILY_CHARS = "20000"          # ~10 músicas novas por dia por IP (cache não conta)
REQUIRE_SIGNATURE = "false"       # "true" quando a maioria já estiver numa versão que assina

# Criado com `npx wrangler kv namespace create CACHE`; troque pelo id que o comando imprimir.
[[kv_namespaces]]
binding = "CACHE"
id = "ae31a6b56993409c8db31ca3d0413b8a"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# As chaves ficam fora do repositório: `npx wrangler secret put AZURE_KEY` e
# `npx wrangler secret put SIGNING_KEY` (a mesma do secret VERSO_SIGNING_KEY do GitHub).
