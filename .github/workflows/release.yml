name: Release

# Só uma tag nova gera build: `git tag v0.3.0 && git push origin v0.3.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  # Cria a release antes dos builds: os jobs de macOS e Windows rodam em paralelo e
  # só anexam arquivos a ela, sem disputar quem cria.
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Verso $TAG" \
              --notes "Baixe o instalador do seu sistema abaixo. Instruções em https://luizfbalves.github.io/verso/"

  macos:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
    runs-on: macos-latest
    env:
      # Embutida no binário (option_env!) para assinar os pedidos ao proxy de tradução.
      VERSO_SIGNING_KEY: ${{ secrets.VERSO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

  windows:
    needs: release
    runs-on: windows-latest
    env:
      # Enquanto o projeto não estiver aprovado no SignPath (secret ausente), os
      # instaladores saem sem assinatura, como antes.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      VERSO_SIGNING_KEY: ${{ secrets.VERSO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build

      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: verso
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          # A aprovação é manual no painel do SignPath; o job espera até 5 h (limite do runner é 6 h).
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed

      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -d signed ]; then dir=signed; else dir=src-tauri/target/release/bundle; fi
          gh release upload "$TAG" "$dir"/nsis/*.exe "$dir"/msi/*.msi --clobber
